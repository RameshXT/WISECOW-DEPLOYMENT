name: CI/CD Pipeline

on:
  push:
    branches:
      - wisecow

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: CODE CHECKOUT
        uses: actions/checkout@v2

      - name: SET UP DOCKER BUILDx
        uses: docker/setup-buildx-action@v3

      - name: LOGIN DOCKER HUB
        run: |
          echo "Logging into Docker Hub.."
          echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          echo "Logged in to Docker Hub."
      
      - name: BUILD AND PUSH DOCKER IMAGE
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: rameshxt/wisecow:v1.0.${{ github.run_number }}
          context: .

      - name: Set IMAGE_TAG using Git SHA
        run: echo "IMAGE_TAG=rameshxt/wisecow:v1.0.${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            echo "IMAGE_TAG is: $IMAGE_TAG"

            ##################################################
            # 1. CLEAN EC2 INSTANCE (Preserve Minikube)
            ##################################################
            echo "Removing old project directory..."
            sudo rm -rf /home/ec2-user/WISECOW-DEPLOYMENT

            echo "Stopping all containers except 'minikube'..."
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -v minikube | awk '{print $1}' | xargs -r docker stop || true

            echo "Removing all containers except 'minikube'..."
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -v minikube | awk '{print $1}' | xargs -r docker rm || true

            echo "Removing all images except 'gcr.io/k8s-minikube/kicbase:v0.0.46'..."
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -v 'gcr.io/k8s-minikube/kicbase:v0.0.46' | awk '{print $2}' | xargs -r docker rmi -f || true

            ##################################################
            # 2. CLONE REPOSITORY
            ##################################################
            echo "Cloning WISECOW-DEPLOYMENT repository..."
            git clone https://github.com/RameshXT/WISECOW-DEPLOYMENT.git

            ##################################################
            # 3. UPDATE DEPLOYMENT FILE WITH IMAGE TAG
            ##################################################
            echo "Updating image tag in deployment.yaml..."
            cd /home/ec2-user/WISECOW-DEPLOYMENT
            chmod +x image-updater.sh
            bash image-updater.sh "$IMAGE_TAG"

            ##################################################
            # 4. APPLY KUBERNETES MANIFESTS
            ##################################################
            echo "Deploying application on Kubernetes..."
            kubectl apply -f /home/ec2-user/WISECOW-DEPLOYMENT/k8s/deployment.yaml
            kubectl apply -f /home/ec2-user/WISECOW-DEPLOYMENT/k8s/service.yaml

            echo "✅ Deployment completed successfully."

      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
  
      - name: Get Pod Name dynamically
        id: get_pod_name
        run: |
          # Get the pod name of the running pod (assumes only one pod in the deployment)
          POD_NAME=$(kubectl get pods --selector=app=wisecow-deployment -o jsonpath='{.items[0].metadata.name}')
          echo "POD_NAME=$POD_NAME" >> $GITHUB_ENV  # Set the pod name as an environment variable
  
      - name: Wait for Pod to be Ready or Error
        run: |
          # Wait for the pod to reach a ready state or an error state
          while true; do
            STATUS=$(kubectl get pod ${{ env.POD_NAME }} -o jsonpath='{.status.phase}')
            echo "Pod status: $STATUS"
            if [ "$STATUS" == "Running" ] || [ "$STATUS" == "Failed" ]; then
              echo "Pod is either Running or Failed. Proceeding to get logs."
              break
            fi
            echo "Waiting for pod to be ready or error state..."
            sleep 5
          done
  
      - name: Get Logs for Dynamic Pod
        run: |
          kubectl logs ${{ env.POD_NAME }}  # Use the dynamic pod name
  
      - name: Check for Pod Error Logs
        run: |
          # Check for possible error logs if the pod has failed
          kubectl logs ${{ env.POD_NAME }} --previous || echo "No previous logs found"
