name: CI/CD Pipeline

on:
  push:
    branches:
      - wisecow

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: CODE CHECKOUT
        uses: actions/checkout@v3

      - name: SET UP DOCKER BUILDx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Official Action)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: BUILD AND PUSH DOCKER IMAGE
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: rameshxt/wisecow:v2.0.${{ github.run_number }}

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=rameshxt/wisecow:v2.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Update K8s Deployment File
        run: |
          chmod +x ./image-updater.sh
          ./image-updater.sh "$IMAGE_TAG"

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            echo "IMAGE_TAG is: $IMAGE_TAG"

            cd /home/ec2-user

            if [ ! -d "WISECOW-DEPLOYMENT" ]; then
              echo "Cloning WISECOW-DEPLOYMENT repository..."
              git clone https://github.com/RameshXT/WISECOW-DEPLOYMENT.git
            else
              echo "Project directory exists. Pulling latest changes..."
              
              cd WISECOW-DEPLOYMENT
              
              git reset --hard HEAD
              git clean -fd
              
              git pull origin wisecow
            fi

            cd /home/ec2-user/WISECOW-DEPLOYMENT
            dos2unix wisecow.sh
