name: CI/CD Pipeline

on:
  push:
    branches:
      - wisecow

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: CODE CHECKOUT
        uses: actions/checkout@v3

      - name: SET UP DOCKER BUILDx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Official Action)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: BUILD AND PUSH DOCKER IMAGE
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: rameshxt/wisecow:v2.0.${{ github.run_number }}

      - name: IMAGE UPDATER
        run: echo "IMAGE_TAG=rameshxt/wisecow:v2.0.${{ github.run_number }}" >> $GITHUB_ENV
