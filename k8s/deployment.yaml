apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow-deployment
  labels:
    app: wisecow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wisecow
  template:
    metadata:
      labels:
        app: wisecow
    spec:
      containers:
        - name: wisecow-container
          image: IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 4499
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          env:
            - name: PATH
              value: "/bin:/usr/bin:/usr/games:/usr/sbin:${PATH}"
          # command: ["/bin/bash", "/app/wisecow.sh"]
